<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Check Payee to Monarch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">✓</span>
      <h1>Check Payee to Monarch</h1>
    </div>
    <a href="#" id="open-options">Settings</a>
  </header>
  <p id="runbanner" class="pill idle" role="status"><span class="dot"></span><span id="runbanner-text">Checking…</span></p>

  <section id="setup" class="card setup">
    <div class="row spread">
      <div class="card-label">Setup</div>
      <a href="#" id="setup-toggle" hidden>Details</a>
    </div>
    <p id="setup-done" class="hint ok" hidden>Setup complete</p>
    <ul id="setup-rows" class="checks">
      <li data-check="key"><span class="dot"></span><span class="name">Claude API key</span><span class="state"></span><a href="#" class="fix" hidden></a></li>
      <li data-check="ally"><span class="dot"></span><span class="name">Ally tab</span><span class="state"></span><a href="#" class="fix" hidden></a></li>
      <li data-check="bridge"><span class="dot"></span><span class="name">Monarch bridge</span><span class="state"></span><a href="#" class="fix" hidden></a></li>
    </ul>
  </section>

  <section id="capture" class="card">
    <div class="card-label">Capture</div>
    <div class="row">
      <label for="window">History</label>
      <select id="window">
        <option value="6">6 months</option>
        <option value="12">1 year</option>
        <option value="24">2 years</option>
        <option value="0">All time</option>
      </select>
      <button id="capture-btn">Capture</button>
    </div>
    <p class="hint">About 1 to 2 minutes per check; Ally throttles. Keeps running when the popup is closed.</p>
    <div class="row util">
      <input id="recheck-num" type="text" placeholder="Check #" />
      <button id="recheck-btn" class="secondary">Re-capture this #</button>
    </div>
    <p id="status" class="hint">Connecting…</p>
    <ul id="progress" class="log"></ul>
  </section>

  <section id="dataset" class="card">
    <div class="card-label">Recipients</div>
    <div class="row spread">
      <div class="counts">
        <span class="big"><span id="count">0</span> checks</span>
        <span class="hint"><span id="needs">0</span> need recipient</span>
      </div>
      <button id="extract-btn">Extract recipients</button>
    </div>
    <div class="row">
      <button id="review-btn" class="dark">Review &amp; correct</button>
      <button id="refresh" class="secondary">Refresh</button>
    </div>
    <ul id="preview" class="log"></ul>
  </section>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
