<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Check Payee to Monarch — Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="review.css" />
</head>
<body>
  <header>
    <h1>Verify check recipients</h1>
    <span class="hint" id="hint"><span id="count">0</span> checks · highlighted rows need review · edits save automatically</span>
    <span class="spacer"></span>
    <button id="toggle-done" class="secondary" hidden>Show reconciled</button>
    <button id="dryrun" class="secondary">Dry run (Monarch)</button>
    <button id="reconcile">Reconcile to Monarch</button>
    <button id="export" class="secondary">Export</button>
  </header>
  <table>
    <thead>
      <tr><th class="num">Check #</th><th class="strip">Payee strip</th><th class="rec">Recipient</th><th class="conf">Confidence</th><th class="amt">Amount</th><th class="date">Date</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <datalist id="recipient-list"></datalist>
  <div id="recon" hidden>
    <h2>Reconciliation</h2>
    <p class="hint" id="recon-summary"></p>
    <ul id="recon-log" class="reconlog"></ul>
  </div>
  <footer><span class="hint" id="status"></span></footer>
  <script type="module" src="review.js"></script>
</body>
</html>
